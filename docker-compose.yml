services:
  privateai:
    build: .
    image: privateai:latest
    container_name: privateai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Reach an Ollama server running on the Docker host by default.
      # Override with a remote GPU host, e.g. http://gpu-server.internal:11434
      OLLAMA_HOST: ${OLLAMA_HOST:-http://10.0.0.181:11434}
      CHAT_BACKEND: ${CHAT_BACKEND:-telegram}
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: 8787
      MEMORY_DIR: /data/sessions
      RAG_DIR: /data/rag
      # 0 = run the embedding model on CPU only (keeps the iGPU for the chat model).
      RAG_EMBED_NUM_GPU: ${RAG_EMBED_NUM_GPU:-0}
      SESSION_SETTINGS_PATH: /data/session_settings.json
      # Which MCP tools the model sees (empty = built-in default list; "all" = every tool).
      MCP_TOOL_ALLOWLIST: ${MCP_TOOL_ALLOWLIST:-}
      # Cap on tool / parameter description length sent to Ollama (0 = unlimited).
      MCP_TOOL_DESC_MAX_CHARS: ${MCP_TOOL_DESC_MAX_CHARS:-200}
      MCP_PARAM_DESC_MAX_CHARS: ${MCP_PARAM_DESC_MAX_CHARS:-80}
      # auto = send tools only when a message looks like it needs file access;
      # always = every request; never = no tools.
      TOOL_ROUTING: ${TOOL_ROUTING:-auto}
      # In auto mode, follow-ups keep tools on this long (seconds) after a file turn.
      TOOL_ROUTING_FOLLOWUP_SECONDS: ${TOOL_ROUTING_FOLLOWUP_SECONDS:-600}
      MCP_CONFIG_PATH: /app/mcp.json
      # --- External memory service (shadow mode by default; see README "Memory service") ---
      # legacy = rolling summary + RAG (today's behaviour); service = core-only context.
      MEMORY_BACKEND: ${MEMORY_BACKEND:-legacy}
      MEMORY_SERVICE_URL: ${MEMORY_SERVICE_URL:-http://memory-service:8765}
      # off | shadow (query in the background, log metadata only) | on (inject the block).
      MEMORY_RECALL: ${MEMORY_RECALL:-shadow}
      # off | on: expose the memory MCP tools (also needs a "memory" entry in mcp.json).
      MEMORY_TOOLS: ${MEMORY_TOOLS:-off}
      # 1 = send a copy of every completed turn to the service.
      MEMORY_DUAL_WRITE: ${MEMORY_DUAL_WRITE:-1}
      MEMORY_RECALL_TIMEOUT: ${MEMORY_RECALL_TIMEOUT:-2.5}
      MEMORY_APPEND_TIMEOUT: ${MEMORY_APPEND_TIMEOUT:-3}
      MEMORY_TOOL_TIMEOUT: ${MEMORY_TOOL_TIMEOUT:-5}
      # Shared secret with the memory-service container (set in .env; empty = no auth).
      MEMORY_TOKEN: ${MEMORY_TOKEN:-}
    # No depends_on on purpose: the bot must start (and keep working) even if the
    # memory service is down.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # MCP tool configuration (read-only inside the container).
      - ./mcp.json:/app/mcp.json:ro
      # Durable conversation memory / RAG / settings.
      - ./data:/data
      - ./workingdir:/workingdir
    ports:
      # Only needed for CHAT_BACKEND=session (Session.js → Python bridge).
      - "${BRIDGE_PORT:-8787}:8787"

  # External long-term memory (SQLite + FTS5 + in-process CPU embeddings). Internal network
  # only (no published port). In this rollout it never calls Ollama.
  memory-service:
    build: ./memory-service
    image: privateai-memory:latest
    container_name: privateai-memory
    restart: unless-stopped
    environment:
      DB_PATH: /data/memory.db
      # Bearer token the bot sends (the same MEMORY_TOKEN from .env).
      AUTH_TOKEN: ${MEMORY_TOKEN:-}
      EMBED_THREADS: "2"
      OMP_NUM_THREADS: "2"
      IDLE_SECONDS: "300"
    volumes:
      # SQLite DB (WAL). Directory must be writable by uid 10002 (the image's user);
      # create it once with: sudo install -d -o 10002 -g 10002 -m 700 memory-data
      - ./memory-data:/data
    mem_limit: 768m
    cpus: 2
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  session-adapter:
    profiles: ["session"]
    build: ./session-adapter
    image: privateai-session-adapter:latest
    container_name: privateai-session
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AGENT_BRIDGE_URL: http://privateai:8787
      SESSION_STORAGE_PATH: /data/storage.db
    volumes:
      - ./data/session-adapter:/data
    depends_on:
      - privateai

volumes:
  privateai-data:
